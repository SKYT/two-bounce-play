<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>투바운드 · 개발 설정</title><style>
*{box-sizing:border-box}body{margin:0;background:#10292a;color:#fff8de;font:16px system-ui,sans-serif}main{max-width:520px;margin:auto;padding:16px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:32px;margin:0}canvas{image-rendering:pixelated;width:100%;height:min(62dvh,540px);display:block;background:#216563;border-radius:16px;margin:14px 0;touch-action:none}button,select{font:inherit;border:0;border-radius:10px;padding:10px;background:#fff4d3;color:#142d2e}#shoot{width:100%;touch-action:none;user-select:none;background:#ffc158;font-weight:800;font-size:20px;padding:14px}footer{margin-top:12px}p{min-height:1.5em;margin:8px 0}
[hidden]{display:none!important}.menu{display:grid;gap:14px;padding:24px 0}.primary{background:#ffc158;font-weight:bold}footer{flex-wrap:wrap}#appearance{min-width:0}#roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}#roster button{padding:4px 4px 7px;border:3px solid transparent}#roster button[aria-pressed=true]{border-color:#ffc158;background:#ffe2a0;font-weight:800}#roster button[aria-pressed=true]::after{content:' ✓'}#roster canvas{width:100%;height:auto;margin:0 0 4px;border-radius:6px;touch-action:auto}#court canvas{height:auto;aspect-ratio:4/5}
  .liveRoster {color:#ffd28a;text-align:center;padding:6px}
  #preview canvas {width:min(100%,280px);height:auto;aspect-ratio:4/5;margin:0 auto}
  #settings {padding-top:12px} #cameraControl {display:flex;align-items:center;gap:8px}
  #roster {grid-template-columns:repeat(auto-fit,minmax(76px,1fr))}
  #roster button {font-size:14px}
</style><main><header><h1>개발 설정</h1></header><section id="home" class="menu" hidden><p id="homePlayer">선수 · 루키</p><strong id="homeRecord"></strong><button id="play" class="primary">게임 시작</button><button id="options">설정</button><details id="ranking"><summary>난이도별 기록</summary><ul id="rankList"></ul></details></section><section id="court" hidden><strong id="score">0 / 0 슛</strong><span id="tierStatus"></span><p id="missCount" aria-live="polite"></p><p id="records"></p><p id="milestone" aria-live="polite"></p><div id="courtCamera"><label id="cameraControl">카메라 <select id="camera"><option value="top">탑뷰</option><option value="side">사이드뷰</option><option value="quarter">쿼터뷰</option></select></label></div><canvas aria-label="농구 코트와 슛 파워 게이지"></canvas><p id="status" aria-live="polite">자유투 라인 · 꾹 누르고 목표 띠에서 놓으세요</p><button id="shoot">꾹 눌러 점프슛</button><section id="gameOver" hidden><h2>게임 오버</h2><p id="result"></p><button id="retry" class="primary">다시 도전</button></section><footer><button id="leave">개발 설정으로 돌아가기</button></footer></section><section id="settings" class="menu">
  <div id="preview" aria-label="선택한 설정의 코트 미리보기"></div>
  <div id="setupCamera"></div>
  <span id="liveLinks"></span>
  <a class="liveRoster" href="./shot-review.html">선수 슛폼 검수</a>
  <a class="liveRoster" href="./body-types.html">체형 미리보기(맨살 마네킹)</a>
  <button id="testGame" class="primary">이 설정으로 테스트 플레이</button><fieldset id="appearance" class="menu"><legend>선수와 테마</legend><div id="roster" role="group" aria-label="선수 선택"></div><label>테마 프리셋 <select id="preset"><option value="" hidden>직접 설정</option><option>그린 코트</option><option>나이트 게임</option><option>우드 아레나</option></select></label><input id="actor" type="hidden">
<label>코트 <select id="floor"><option>그린</option><option>야간</option><option>우드</option></select></label>
<label>공 <select id="skinBall"><option>오렌지</option><option>아이스</option><option>라임</option><option value="클래식" disabled>클래식 농구공 · 누적 5골</option></select></label>
<label>선수 피부톤 <select id="skinTone"><option value="light">밝은 톤</option><option value="golden">따뜻한 중간 톤</option><option value="deep">짙은 톤</option></select></label>
<label>코스튬 <select id="costume"><option>기본</option><option>크리스마스 산타</option></select></label>
<label>유니폼 <select id="jersey"><option>크림</option><option>블루</option><option>레드</option></select></label>
<label>헤어밴드 <select id="band"><option>없음</option><option>화이트</option><option>블랙</option><option value="골드" disabled>골드 헤어밴드 · 3연속</option></select></label><label>등번호 <input id="jerseyNumber" inputmode="numeric" maxlength="2" size="2"></label></fieldset>
<label>난이도 <select id="level"><option value=".45">쉬움 · Lv.1</option><option value=".18">보통 · Lv.3</option><option value=".10">어려움 · Lv.5</option></select></label><label>게이지 방식 <select id="motion"><option value="classic">원샷 · 끝에 닿으면 실패</option><option value="bounce">왕복 · 위아래로 반복</option><option value="dial">원형 · 시계 방향으로 반복</option></select></label>
<label>게이지 속도 <select id="pace"><option value="classic">기존 속도 · 0.95초</option><option value="auto">단계별 · 1.2초 → 1초</option><option value="slow">느림 · 1.2초</option><option value="normal">보통 · 1초</option><option value="fast">빠름 · 0.75초</option></select><small> 편도 또는 한 바퀴 기준 · 왕복이나 회전을 마칠 때마다 목표 띠가 좁고 흐려져요</small></label><label><input type="checkbox" id="randomBand"> 랜덤 목표 띠</label><label><input type="checkbox" id="promotion"> 10골마다 승급 <small id="promotionHint"></small></label><label><input type="checkbox" id="fadeBand"> 상급 목표 띠 숨기기 <small>Lv.4부터 적용</small></label><button id="sound" aria-pressed="true">소리 켜짐</button><button id="haptic" aria-pressed="true">진동 켜짐</button><button id="back" class="primary">이 설정으로 테스트 플레이</button></section></main><script src="./jun-full.js?v=7bec02c"></script><script src="./seojin-full.js?v=7bec02c"></script><script src="./player-atlas.js?v=7bec02c"></script><script src="./engine-v22.js?v=7bec02c"></script>
<script src="./lab.js?v=7bec02c"></script>
<script type="module">
// One link per registered player: game/players/index.json is the only list.
import {loadRoster} from '../game/players.js?v=7bec02c';
const box = document.getElementById('liveLinks');
for (const [id, spec] of await loadRoster()) {
  const link = document.createElement('a');
  link.className = 'liveRoster';
  link.href = '../?player=' + id;
  link.textContent = '현재 플레이 빌드에서 ' + spec.name + ' 테스트' + (spec.costumes?.length ? ' (의상 ' + spec.costumes.length + '종)' : '');
  box.append(link);
}
</script>
</html>
